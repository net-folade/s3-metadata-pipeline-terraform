# things exist: a remote state backend (uncomment the backend block in envs/*/providers.tf)
# and an IAM role in the target account that trusts GitHub's OIDC provider. Neither can
# work against local state — a runner starts with an empty working directory, so a plan
# against local state would compare live infrastructure to nothing and propose recreating
# the whole stack. Authentication is OIDC only; no long-lived access keys are used here or
# stored as secrets.
