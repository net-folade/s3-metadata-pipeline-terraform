name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.15.8"

jobs:
  # Formatting is checked once for the whole repo; it needs no providers and no state.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

  # Each environment root is validated independently, because each has its own provider
  # requirements and its own module wiring to type-check.
  validate:
    name: validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # -backend=false skips backend initialisation entirely, so no state and no
      # credentials are needed to type-check the configuration.
      - run: terraform init -backend=false
        working-directory: envs/${{ matrix.environment }}

      - run: terraform validate
        working-directory: envs/${{ matrix.environment }}

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - run: tflint --init

      # --recursive lints every module and environment root, not just the repo root.
      - run: tflint --recursive --format compact

